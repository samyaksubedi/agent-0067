services:
  redis:
    image: redis:7-alpine
    container_name: agent67-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-agent67-local-dev}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped

volumes:
  redis-data:
